version: '3.8'

services:
  # ============================================
  # 1. MongoDB Database Document Store
  # ============================================
  mongodb:
    image: mongo:7.0
    container_name: expense_tracker_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
      MONGO_INITDB_DATABASE: expense_tracker
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - expense_tracker_network

  # ============================================
  # 2. NestJS REST API Gateway Service
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expense_tracker_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:adminpassword@mongodb:27017/expense_tracker?authSource=admin
      JWT_SECRET: production_supersecret_jwt_access_key
      JWT_REFRESH_SECRET: production_supersecret_jwt_refresh_key
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/v1/health', (r) => { if (r.statusCode !== 200) process.exit(1); })"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - expense_tracker_network

  # ============================================
  # 3. Nginx + React 19 Frontend Web Application
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: expense_tracker_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - expense_tracker_network

volumes:
  mongo_data:
    driver: local

networks:
  expense_tracker_network:
    driver: bridge
